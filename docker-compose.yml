# ─────────────────────────────────────────────────────────────────────────────
# SteVe Ladehistorie – Web-Frontend
#
# Zugriff auf die SteVe-DB per "docker exec" über den Docker-Socket –
# ein gemeinsames Docker-Netzwerk ist dafür nicht nötig.
# ─────────────────────────────────────────────────────────────────────────────

services:
  reporting:
    build: .
    container_name: steve-reporting
    restart: unless-stopped
    ports:
      - "5000:5000"
    # Zugangsdaten & Secret Key: siehe .env.example → als .env kopieren
    env_file: .env
    volumes:
      # Docker-Socket für docker exec
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistente SQLite-Datenbank (interne User)
      - reporting-data:/app/data

volumes:
  reporting-data:
