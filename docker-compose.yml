# ─────────────────────────────────────────────────────────────────────────────
# SteVe Ladehistorie – Web-Frontend
#
# Netzwerkname ermitteln: docker network ls | grep steve
# ─────────────────────────────────────────────────────────────────────────────

services:
  reporting:
    build: .
    container_name: steve-reporting
    restart: unless-stopped
    ports:
      - "5000:5000"
    # Zugangsdaten & Secret Key: siehe .env.example → als .env kopieren
    env_file: .env
    volumes:
      # Docker-Socket für docker exec
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistente SQLite-Datenbank (interne User)
      - reporting-data:/app/data
    networks:
      - steve-steve-3120_default

volumes:
  reporting-data:

networks:
  steve-steve-3120_default:
    external: true
