version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# SteVe Ladehistorie – Web-Frontend
#
# Dieses Compose-File wird als ERGÄNZUNG zum bestehenden SteVe-Compose genutzt.
# Der Container muss im selben Docker-Netzwerk wie die SteVe-DB laufen UND
# Zugriff auf den Docker-Socket haben, damit docker exec funktioniert.
#
# Voraussetzung: Das SteVe-Compose-Netzwerk heißt "steve_default" (Standard).
# Falls es anders heißt: docker network ls prüfen und unten anpassen.
# ─────────────────────────────────────────────────────────────────────────────

services:
  reporting:
    build: .
    container_name: steve-reporting
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # SteVe-DB-Verbindung
      DOCKER_CONTAINER: steve-steve-3120-db-1
      DB_NAME: steve
      DB_USER: steve
      DB_PASSWORD: "5EcpFOss1jmFj8"
      STEVE_VERSION: current
      # Flask Secret Key – bitte ändern!
      SECRET_KEY: "bitte-einen-langen-zufaelligen-wert-hier-eintragen"
    volumes:
      # Docker-Socket für docker exec
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistente SQLite-Datenbank (interne User)
      - reporting-data:/app/users.db
    networks:
      - steve_default

volumes:
  reporting-data:

networks:
  steve_default:
    external: true
