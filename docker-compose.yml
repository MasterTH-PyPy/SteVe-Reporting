# ─────────────────────────────────────────────────────────────────────────────
# SteVe Ladehistorie – Web-Frontend
#
# Netzwerkname ermitteln: docker network ls | grep steve
# ─────────────────────────────────────────────────────────────────────────────

services:
  reporting:
    build: .
    container_name: steve-reporting
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # SteVe-DB-Verbindung
      DOCKER_CONTAINER: steve-steve-3120-db-1
      DB_NAME: steve
      DB_USER: steve
      DB_PASSWORD: "5EcpFOss1jmFj8"
      STEVE_VERSION: current
      # Flask Secret Key – bitte ändern!
      SECRET_KEY: "bitte-einen-langen-zufaelligen-wert-hier-eintragen"
    volumes:
      # Docker-Socket für docker exec
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistente SQLite-Datenbank (interne User)
      - reporting-data:/app/users.db
    networks:
      - steve-steve-3120_default

volumes:
  reporting-data:

networks:
  steve-steve-3120_default:
    external: true
