<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Anmelden – SteVe Ladehistorie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>
</head>
<body class="login-page">

<div class="login-wrapper">
  <div class="login-card shadow-lg">
    <div class="login-header text-center">
      <div class="login-logo-wrap mb-3">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Stadt Pfungstadt" class="login-logo"/>
      </div>
      <h4 class="fw-bold mb-1">Ladehistorie</h4>
      <p class="login-subtitle mb-0">Bitte melden Sie sich an</p>
    </div>
    <div class="login-body p-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Benutzername</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-person text-muted"></i>
            </span>
            <input type="text" name="username" class="form-control"
                   placeholder="Ihr Benutzername" autofocus required/>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small">Passwort</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock text-muted"></i>
            </span>
            <input type="password" name="password" class="form-control"
                   placeholder="Ihr Passwort" required/>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Anmelden
        </button>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
